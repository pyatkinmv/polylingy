# App version, shown in the UI and used for the installer.
# 0.MINOR.PATCH: bump PATCH for fixes and small changes within the same scope,
# MINOR for a big feature or a substantial batch of changes. See CLAUDE.md "Versioning".
version=0.8.6

# Shown after the version in the UI and in the name of the installer file (the version inside the MSI can only be numbers).
# Empty for a final release.
releaseStage=alpha
